            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255,255,255,0.4);

            padding: 10px 25px;

            font-weight: bold;

            background: rgba(255,255,255,0.6);

        .nav-btn:active,
        .nav-btn.active {
            border-style: inset;
            background: rgba(255,255,255,0.6);
        }

            animation: fadeIn 0.3s ease;

            from { opacity: 0; }
            to   { opacity: 1; }
        }

        }

        }

            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.15);
        }
