<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="shortcut icon" href="favicon_io/favicon.ico">

    <title>mbe evidence question bank</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #e6f3ff;
            background-image:
                radial-gradient(ellipse 340px 210px at 12% 18%, rgba(255,255,255,0.65) 0%, transparent 70%),
                radial-gradient(ellipse 220px 160px at 78% 8%,  rgba(255,255,255,0.45) 0%, transparent 70%),
                radial-gradient(ellipse 280px 180px at 55% 52%, rgba(255,255,255,0.30) 0%, transparent 70%),
                radial-gradient(ellipse 370px 220px at 22% 82%, rgba(255,255,255,0.50) 0%, transparent 70%),
                radial-gradient(ellipse 200px 140px at 90% 65%, rgba(255,255,255,0.35) 0%, transparent 70%);
            color: #000;
            padding: 20px;
            line-height: 1.6;
            font-family: sans-serif;
        }

        h1 { font-size: 2.5rem; font-weight: normal; margin-bottom: 10px; text-align: center; }
        .subtitle { font-size: 0.95rem; text-align: center; margin: 5px 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }

        .nav { margin: 30px 0; text-align: center; display: flex; justify-content: center; gap: 20px; }
        .nav-btn {
            background: rgba(255,255,255,0.4);
            border: 2px outset #ffffff;
            padding: 10px 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        .nav-btn.active { border-style: inset; background: rgba(255,255,255,0.6); }

        .quiz-question-card, .question-card {
            border: 2px outset #ffffff;
            padding: 25px;
            margin: 20px 0;
            background: rgba(255,255,255,0.4);
            text-align: left;
        }

        .choices-area {
            background: rgba(255,255,255,0.3);
            padding: 15px;
            margin: 15px 0;
            border-left: 2px solid rgba(0,0,0,0.15);
        }

        .question-card { cursor: pointer; }
        .question-card-header { display: flex; justify-content: space-between; align-items: center; }
        .question-card-content { display: none; margin-top: 15px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 15px; }
        .question-card.expanded .question-card-content { display: block; }
        
        .controls-box { background: rgba(255,255,255,0.4); border: 2px outset #ffffff; padding: 20px; margin: 20px 0; text-align: center; }
        .search-box { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #999; }
        
        .answer-box { background: rgba(255,255,255,0.5); padding: 10px; margin-top: 10px; border-left: 3px solid #000; }
        .hidden { display: none; }
        .footer { margin-top: 50px; text-align: center; border-top: 1px solid #000; padding-top: 20px; }
    </style>
</head>
<body>

<center>
    <h1>mbe evidence question bank</h1>
    <p class="subtitle">made by grace kantrow</p>
    <div class="nav">
        <button class="nav-btn active" onclick="switchMode('quiz')">quiz mode</button>
        <button class="nav-btn" onclick="switchMode('library')">library</button>
    </div>
</center>

<div class="container">
    <div id="quizMode">
        <div class="controls-box">
            <div style="font-weight: bold; font-style: italic;">practice test</div>
            <p style="margin: 10px 0; font-size: 0.9rem;">10 random questions from the bank</p>
            <button class="nav-btn" style="font-size: 0.9rem;" onclick="generateNewQuiz()">generate new quiz</button>
        </div>
        <div id="quizQuestionsContainer"></div>
    </div>

    <div id="libraryMode" class="hidden">
        <h2 style="text-align: center; margin-bottom: 20px;">question library</h2>
        <div class="controls-box">
            <input type="text" class="search-box" id="searchBox" placeholder="search questions or scenarios..." onkeyup="filterLibrary()">
            <select id="sourceFilter" onchange="filterLibrary()" style="width: 100%; padding: 5px;">
                <option value="">all sources</option>
            </select>
        </div>
        <div id="libraryStats" style="text-align: center; font-size: 0.8rem; margin-bottom: 10px;"></div>
        <div id="libraryContainer"></div>
    </div>

    <div class="footer">
        <p id="totalQuestionsFooter"></p>
        <center>
            <img src="favicon_io/apple-touch-icon.png" width="40" style="mix-blend-mode: multiply; margin-top:20px;">
        </center>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
    const CSV_URL = 'https://raw.githubusercontent.com/kombuchauncle/Evidence-MBEs/main/mbe_questions.csv';
    let allQuestions = [];

    async function initializeApp() {
        try {
            const response = await fetch(CSV_URL);
            const csv = await response.text();
            Papa.parse(csv, {
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    allQuestions = results.data.filter(q => q.Question);
                    updateSourceFilter();
                    generateNewQuiz();
                    updateFooter();
                }
            });
        } catch (e) { console.error("Load error:", e); }
    }

    function updateSourceFilter() {
        const sources = [...new Set(allQuestions.map(q => q.Source).filter(Boolean))];
        const select = document.getElementById('sourceFilter');
        sources.forEach(s => {
            const opt = document.createElement('option');
            opt.value = opt.textContent = s;
            select.appendChild(opt);
        });
    }

    function generateNewQuiz() {
        const shuffled = [...allQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
        const container = document.getElementById('quizQuestionsContainer');
        container.innerHTML = shuffled.map((q, i) => `
            <div class="quiz-question-card">
                <div style="font-style: italic; font-size: 0.8rem; margin-bottom: 10px;">question ${i+1} of 10</div>
                ${q.Scenario ? `<div style="margin-bottom: 15px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px;">${q.Scenario}</div>` : ''}
                <div style="font-weight: bold; margin-bottom: 15px;">${q.Question}</div>
                <div class="choices-area">
                    <div>A. ${q.Choice_A}</div><div>B. ${q.Choice_B}</div>
                    <div>C. ${q.Choice_C}</div><div>D. ${q.Choice_D}</div>
                </div>
                <button class="nav-btn" style="font-size: 0.8rem; padding: 5px 10px;" onclick="toggleVisibility(this)">show answer</button>
                <div class="answer-box hidden">
                    <b>Answer: ${q.Correct_Answer}</b><br><small>${q.Explanation || ''}</small>
                </div>
            </div>
        `).join('');
        window.scrollTo(0,0);
    }

    function toggleVisibility(btn) {
        const target = btn.nextElementSibling;
        target.classList.toggle('hidden');
        btn.textContent = target.classList.contains('hidden') ? 'show answer' : 'hide answer';
    }

    function filterLibrary() {
        const term = document.getElementById('searchBox').value.toLowerCase();
        const src = document.getElementById('sourceFilter').value;
        const filtered = allQuestions.filter(q => 
            (q.Question.toLowerCase().includes(term) || (q.Scenario && q.Scenario.toLowerCase().includes(term))) &&
            (!src || q.Source === src)
        );
        
        const container = document.getElementById('libraryContainer');
        document.getElementById('libraryStats').textContent = `showing ${filtered.length} questions`;
        container.innerHTML = filtered.map(q => `
            <div class="question-card" onclick="this.classList.toggle('expanded')">
                <div class="question-card-header">
                    <div style="font-weight: bold; flex: 1;">${q.Question}</div>
                    <div style="margin-left: 10px;">▼</div>
                </div>
                <div class="question-card-content">
                    ${q.Scenario ? `<div style="margin-bottom: 10px; font-style: italic;">${q.Scenario}</div>` : ''}
                    <div class="choices-area">
                        <div>A. ${q.Choice_A}</div><div>B. ${q.Choice_B}</div>
                        <div>C. ${q.Choice_C}</div><div>D. ${q.Choice_D}</div>
                    </div>
                    <div class="answer-box"><b>Correct: ${q.Correct_Answer}</b></div>
                </div>
            </div>
        `).join('');
    }

    function switchMode(mode) {
        document.getElementById('quizMode').classList.toggle('hidden', mode !== 'quiz');
        document.getElementById('libraryMode').classList.toggle('hidden', mode !== 'library');
        const btns = document.querySelectorAll('.nav-btn');
        btns[0].classList.toggle('active', mode === 'quiz');
        btns[1].classList.toggle('active', mode === 'library');
        if(mode === 'library') filterLibrary();
    }

    function updateFooter() {
        document.getElementById('totalQuestionsFooter').innerHTML = `<b>${allQuestions.length}</b> total questions in bank`;
    }

    document.addEventListener('DOMContentLoaded', initializeApp);
</script>
</body>
</html>
